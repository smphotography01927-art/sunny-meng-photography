<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Testimonials • SUNNY MENG PHOTOGRAPHY</title>
<style>
  :root{ --bg:#eaeaea; --card:#fff; --text:#111; --muted:#444; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial}
  .page{max-width:980px;margin:0 auto;padding:12px}
  .card{background:var(--card);min-height:100vh;padding:14px 14px 40px;
        box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 8px 0}
  .nav{display:flex;gap:18px;font-size:15px}
  .brand{font-family:Georgia,"Times New Roman",serif;text-align:center;line-height:1.1}
  .brand .up{letter-spacing:.15em;font-size:16px}
  .brand .down{letter-spacing:.1em;font-size:18px}
  a{text-decoration:none;color:inherit}
  h1{margin:28px 0 6px;text-align:center;font-weight:600;letter-spacing:.08em;font-size:22px}
  .muted{text-align:center;color:#555;margin-bottom:18px}

  /* Layout */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} .top{grid-template-columns:1fr} .nav{display:none} .brand{text-align:left} }

  /* Form */
  .box{border:1px solid #ddd;border-radius:10px;padding:16px}
  label{font-size:13px;letter-spacing:.04em}
  input[type="text"], textarea, select{
    width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit
  }
  textarea{min-height:110px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
  .btn{display:inline-block;border:1.5px solid #111;background:#fff;color:#111;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;letter-spacing:.06em}
  .btn:disabled{opacity:.6;cursor:not-allowed}

  /* Stars (input) */
  .stars{display:inline-flex;flex-direction:row-reverse;gap:6px}
  .stars input{display:none}
  .stars label{font-size:24px;cursor:pointer;filter:grayscale(1);opacity:.6}
  .stars input:checked ~ label,
  .stars label:hover,
  .stars label:hover ~ label{filter:none;opacity:1}
  .star{color:#111}

  /* List */
  .item{border-bottom:1px solid #eee;padding:14px 4px}
  .item .name{font-weight:600}
  .item .when{font-size:12px;color:#666}
  .item .txt{margin:6px 0 2px}
  .starline{font-size:16px}

  /* Summary bar */
  .summary{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
  .big{font-size:28px;font-weight:700}
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <header class="top">
        <nav class="nav">
          <a href="index.html">← Back</a>
          <a href="index.html#gallery">Gallery</a>
        </nav>
        <div class="brand">
          <div class="up">SUNNY MENG</div>
          <div class="down">PHOTOGRAPHY</div>
        </div>
        <div></div>
      </header>

      <h1>TESTIMONIALS</h1>
      <div class="muted">Leave a review and see what others say.</div>

      <section class="grid">
        <!-- Left: form -->
        <div class="box">
          <h3 style="margin:0 0 10px">Write a review</h3>
          <form id="reviewForm">
            <div style="margin:10px 0">
              <label>Your name</label>
              <input id="name" type="text" placeholder="First name (optional)">
            </div>

            <div style="margin:10px 0">
              <label>Rating</label><br>
              <div class="stars" aria-label="Star rating">
                <!-- radio 5→1 so hover fills leftwards -->
                <input type="radio" name="rating" id="r5" value="5"><label class="star" for="r5">★</label>
                <input type="radio" name="rating" id="r4" value="4"><label class="star" for="r4">★</label>
                <input type="radio" name="rating" id="r3" value="3"><label class="star" for="r3">★</label>
                <input type="radio" name="rating" id="r2" value="2"><label class="star" for="r2">★</label>
                <input type="radio" name="rating" id="r1" value="1"><label class="star" for="r1">★</label>
              </div>
            </div>

            <div style="margin:10px 0">
              <label>Comment</label>
              <textarea id="comment" placeholder="Share your experience…"></textarea>
            </div>

            <div class="row" style="margin-top:6px">
              <button class="btn" id="submitBtn" type="submit">Submit review</button>
              <small id="msg" style="color:#2a7a2a;opacity:0">Saved!</small>
            </div>
          </form>
        </div>

        <!-- Right: list & filters -->
        <div>
          <div class="summary">
            <div>
              <div id="avg" class="big">0.0</div>
              <div id="avgStars" class="starline" aria-hidden="true">☆☆☆☆☆</div>
              <div id="count" class="muted" style="text-align:left;margin:2px 0 0">0 reviews</div>
            </div>
            <div>
              <label for="sort" style="font-size:13px;letter-spacing:.04em">Sort</label>
              <select id="sort">
                <option value="top">Highest rating</option>
                <option value="new">Newest</option>
                <option value="low">Lowest rating</option>
              </select>
            </div>
          </div>

          <div id="list" class="box" style="padding:0"></div>
        </div>
      </section>
    </div>
  </div>

<script>
(function(){
  const KEY = 'sm_testimonials';
  const $ = (s) => document.querySelector(s);
  const listEl = $('#list'), avgEl = $('#avg'), avgStarsEl = $('#avgStars'), countEl = $('#count'), sortEl = $('#sort');

  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch{ return []; }
  }
  function save(items){ localStorage.setItem(KEY, JSON.stringify(items)); }

  function starLine(n){
    n = Math.max(0, Math.min(5, n));
    const full = '★'.repeat(Math.round(n));
    const empty = '☆'.repeat(5 - Math.round(n));
    return full + empty;
  }

  function render(){
    const items = load();
    // sort
    const mode = sortEl.value;
    items.sort((a,b)=>{
      if(mode==='new') return b.ts - a.ts;
      if(mode==='low') return a.rating - b.rating || b.ts - a.ts;
      // default: highest first
      return b.rating - a.rating || b.ts - a.ts;
    });
    // list
    listEl.innerHTML = items.length ? items.map(it => `
      <div class="item">
        <div class="starline" aria-hidden="true">${'★'.repeat(it.rating)}${'☆'.repeat(5-it.rating)}</div>
        <div><span class="name">${it.name||'Anonymous'}</span> · <span class="when">${new Date(it.ts).toLocaleDateString()}</span></div>
        <div class="txt">${(it.comment||'').replace(/[<>&]/g, s=>({ '<':'&lt;','>':'&gt;','&':'&amp;' }[s]))}</div>
      </div>
    `).join('') : `<div style="padding:16px;text-align:center;color:#666">No reviews yet — be the first!</div>`;

    // summary
    const avg = items.length ? (items.reduce((s,i)=>s+i.rating,0)/items.length) : 0;
    avgEl.textContent = avg.toFixed(1);
    avgStarsEl.textContent = starLine(avg);
    countEl.textContent = `${items.length} review${items.length===1?'':'s'}`;
  }

  // form submit
  $('#reviewForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = $('#name').value.trim();
    const comment = $('#comment').value.trim();
    const rating = Number((document.querySelector('input[name="rating"]:checked')||{}).value||0);
    if(!rating || !comment){ alert('Please add a rating and a comment.'); return; }

    const items = load();
    items.push({ name, comment, rating, ts: Date.now() });
    save(items);
    $('#reviewForm').reset();
    render();
    const msg = $('#msg'); msg.style.opacity = 1; setTimeout(()=>msg.style.opacity=0, 1200);
  });

  sortEl.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
