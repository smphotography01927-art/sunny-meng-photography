<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUNNY MENG PHOTOGRAPHY</title>
  <style>
    :root {
      --bg:#eaeaea;
      --card:#ffffff;
      --text:#111;
      --muted:#444;
      --link:#111;
      --btn:#111;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body {
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    }

    .page { max-width:980px; margin:0 auto; padding:12px; }
    .card {
      background:var(--card);
      min-height:100vh;
      padding:14px 14px 40px;
      box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
    }

    .top {
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:8px;
      padding:8px 8px 0;
    }

    .navleft, .navright {
      display:flex;
      gap:18px;
      align-items:center;
      font-size:13px;
    }

    .brand {
      font-family:Georgia,"Times New Roman",serif;
      text-align:center;
      line-height:1.1;
    }
    .brand .up { letter-spacing:.12em; font-size:12px; }
    .brand .down { letter-spacing:.08em; font-size:13px; }

    a { color:var(--link); text-decoration:none; }

    h2 {
      margin:28px 0 12px;
      text-align:center;
      font-weight:500;
      letter-spacing:.08em;
      font-size:13px;
    }

    /* GALLERY */
    .gallery {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:0 12px;
    }
    .tile {
      position:relative;
      width:100%;
      background:#f3f3f3;
      overflow:hidden;
      border:1px solid rgba(0,0,0,.04);
    }
    .tile img {
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      object-position:center center; /* <-- ensures middle is shown */
      transition:transform .25s ease, opacity .25s ease;
      display:block;
    }
    .tile:hover img { transform:scale(1.02); opacity:.96; }

    .ratio-3x2 { padding-top:66.66%; }
    .ratio-4x5 { padding-top:125%; }
    .ratio-9x16 { padding-top:177.77%; }

    /* BOTTOM SECTIONS */
    .bottom{
      position:relative; z-index:2;
      display:grid; grid-template-columns:1fr 1fr;
      gap:10px; margin:24px auto 0; max-width:980px;
    }
    .bsec{ padding:24px 0; text-align:center; }
    .btitle{ font-size:12px; letter-spacing:.12em; margin-bottom:8px; }
    .blink{ display:inline-block; margin-top:8px; font-size:12px; }
    .btn{
      margin-top:10px; font-size:11px; letter-spacing:.08em;
      border:1px solid #111; background:#fff; color:#111;
      padding:6px 12px; cursor:pointer; text-decoration:none; display:inline-block;
      transition:background .2s ease, color .2s ease;
    }
    .btn:hover { background:#111; color:#fff; }

    @media (max-width:700px){ .bottom { grid-template-columns:1fr; } }
    @media (max-width:820px){
      .gallery { grid-template-columns:1fr; }
      .top { grid-template-columns:1fr; }
      .brand { text-align:left; }
      .navleft, .navright { display:none; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <!-- TOP NAV -->
      <div class="top">
        <nav class="navleft">
          <a href="https://smphotography01927-art.github.io/sunny-meng-photography/">Sunny Meng</a>
          <a href="https://smphotography01927-art.github.io/sunny-meng-photography/">Home</a>
          <a href="#gallery">Gallery</a>
        </nav>
        <div class="brand">
          <div class="up">SUNNY MENG</div>
          <div class="down">PHOTOGRAPHY</div>
        </div>
        <nav class="navright" style="justify-self:end">
          <a href="https://smphotography01927-art.github.io/sunny-meng-photography/contact.html?v=3">Services</a>
          <a href="https://smphotography01927-art.github.io/sunny-meng-photography/contact.html?v=3">About</a>
          <a href="https://smphotography01927-art.github.io/sunny-meng-photography/contact.html?v=3">Contact</a>
        </nav>
      </div>

      <!-- GALLERY -->
      <h2 id="gallery">GALLERY</h2>
      <section class="gallery">
        <div class="tile ratio-3x2">
          <img src="Photojpg/IMG_2419.JPG" alt="Photo 1" loading="lazy" decoding="async">
        </div>
        <div class="tile ratio-4x5">
          <img src="Photojpg/IMG_2730.jpeg" alt="Photo 2" loading="lazy" decoding="async">
        </div>
        <div class="tile ratio-4x5">
          <img src="Photojpg/IMG_3104.jpeg" alt="Photo 3" loading="lazy" decoding="async">
        </div>
        <div class="tile ratio-4x5">
          <img src="Photojpg/IMG_3378.jpeg" alt="Photo 4" loading="lazy" decoding="async">
        </div>
        <div class="tile ratio-3x2">
          <img src="Photojpg/IMG_3774.jpeg" alt="Photo 5" loading="lazy" decoding="async">
        </div>
        <div class="tile ratio-4x5">
          <img src="Photojpg/IMG_3783.jpeg" alt="Photo 6" loading="lazy" decoding="async">
        </div>
        <div class="tile ratio-4x5">
          <img src="Photojpg/IMG_3932.jpeg" alt="Photo 7" loading="lazy" decoding="async">
        </div>
        <!-- Image 8: fixed center crop and cache-busting -->
        <div class="tile ratio-3x2">
          <img id="img8" src="Photojpg/FC0161BF-912B-4307-9A4A-83597EAE1F44.JPG?v=3"
               alt="Photo 8" loading="lazy" decoding="async">
        </div>
      </section>

      <!-- BOTTOM SECTIONS -->
      <div class="bottom">
        <div class="bsec">
          <div class="btitle">TESTIMONIALS</div>
          <a class="blink" href="#">REAL CLIENTS. REAL STORIES.</a>
          <div><a class="btn" href="https://smphotography01927-art.github.io/sunny-meng-photography/testimonials.html">VIEW MORE</a></div>
        </div>

        <div class="bsec">
          <div class="btitle">SERVICES</div>
          <a class="blink" href="https://smphotography01927-art.github.io/sunny-meng-photography/contact.html?v=3">VIEW PACKAGES</a>
          <div><a class="btn" href="https://smphotography01927-art.github.io/sunny-meng-photography/contact.html?v=3">VIEW MORE</a></div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
